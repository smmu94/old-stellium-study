      <path d="M150,280 L180,300" />
      <path d="M200,320 L230,340" />
      <path d="M1600,400 L1630,420" />
      <path d="M1650,380 L1680,400" />
      <path d="M1700,420 L1730,440" />
    </g>
    
    <!-- Black hole sketch -->
    <g transform="translate(350, 850)" stroke-width="1">
      <!-- Event horizon -->
      <circle cx="0" cy="0" r="25" />
      <!-- Accretion disk -->
      <ellipse cx="0" cy="0" rx="45" ry="15" stroke-dasharray="3,2" />
      <ellipse cx="0" cy="0" rx="35" ry="12" stroke-dasharray="3,2" />
      <!-- Matter spiraling in -->
      <path d="M40,10 Q30,5 25,0 Q30,-5 35,-8" stroke-dasharray="2,1" />
    </g>
    
    <!-- Space capsule -->
    <g transform="translate(900, 850)">
      <!-- Capsule body -->
      <path d="M0,-20 Q-15,-15 -15,0 Q-15,15 0,20 Q15,15 15,0 Q15,-15 0,-20 Z" />
