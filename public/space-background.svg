      <path d="M-15,0 Q0,25 15,0" stroke-dasharray="4,2" />
      <!-- Parachute lines -->
      <path d="M-10,-20 Q-15,-35 -20,-30" stroke-width="1" stroke-dasharray="2,1" />
      <path d="M0,-20 Q0,-40 0,-35" stroke-width="1" stroke-dasharray="2,1" />
      <path d="M10,-20 Q15,-35 20,-30" stroke-width="1" stroke-dasharray="2,1" />
    </g>
    
    <!-- Alien planet with rings -->
    <g transform="translate(1500, 150)">
      <!-- Planet -->
      <circle cx="0" cy="0" r="35" />
      <!-- Surface features -->
      <circle cx="-15" cy="-10" r="5" stroke-width="1" />
      <circle cx="10" cy="5" r="8" stroke-width="1" />
      <circle cx="5" cy="-15" r="3" stroke-width="1" />
      <!-- Rings -->
      <ellipse cx="0" cy="0" rx="50" ry="12" stroke-dasharray="5,3" />
      <ellipse cx="0" cy="0" rx="60" ry="15" stroke-dasharray="5,3" />
    </g>
    
    <!-- Observatory dome -->
    <g transform="translate(700, 950)">
      <!-- Base -->
      <rect x="-40" y="0" width="80" height="30" />
      <!-- Dome -->
      <path d="M-40,0 Q0,-30 40,0" />
      <!-- Dome opening -->
      <path d="M-10,0 Q0,-15 10,0" stroke-width="1" />
      <!-- Details -->
      <circle cx="-20" cy="15" r="3" />
      <circle cx="20" cy="15" r="3" />
    </g>
    
  </g>
  
