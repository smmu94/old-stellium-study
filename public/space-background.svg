<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#ffffff" />
  
  <!-- Hand-drawn space sketches -->
  <g stroke="#0a0f29" stroke-width="2" fill="none" opacity="0.3">
    
    <!-- Planet with rings (Saturn style) -->
    <g transform="translate(300, 200)">
      <circle cx="0" cy="0" r="40" />
      <!-- Ring -->
      <ellipse cx="0" cy="0" rx="65" ry="15" />
      <ellipse cx="0" cy="0" rx="55" ry="12" />
    </g>
    
    <!-- Rocket ship sketch -->
    <g transform="translate(800, 400)">
      <!-- Body -->
      <path d="M0,60 L-15,0 L15,0 Z" />
      <rect x="-8" y="0" width="16" height="40" />
      <!-- Fins -->
      <path d="M-8,40 L-20,60 L-8,60 Z" />
      <path d="M8,40 L20,60 L8,60 Z" />
      <!-- Flames -->
      <path d="M-6,60 Q-10,75 -6,80 Q0,75 6,80 Q10,75 6,60" stroke-dasharray="3,2" />
    </g>
    
    <!-- Constellation -->
    <g transform="translate(1200, 300)" stroke-width="1">
      <!-- Stars -->
      <circle cx="0" cy="0" r="2" fill="#0a0f29" />
      <circle cx="40" cy="-20" r="2" fill="#0a0f29" />
      <circle cx="80" cy="10" r="2" fill="#0a0f29" />
      <circle cx="60" cy="40" r="2" fill="#0a0f29" />
      <circle cx="20" cy="50" r="2" fill="#0a0f29" />
      <!-- Connection lines -->
      <path d="M0,0 L40,-20 L80,10 L60,40 L20,50 L0,0" stroke-dasharray="4,3" />
    </g>
    
    <!-- UFO/Flying saucer -->
    <g transform="translate(1600, 500)">
      <ellipse cx="0" cy="0" rx="50" ry="15" />
      <ellipse cx="0" cy="-8" rx="25" ry="12" />
      <!-- Lights -->
      <circle cx="-30" cy="0" r="3" fill="#fadd8c" opacity="0.7" />
      <circle cx="0" cy="0" r="3" fill="#fadd8c" opacity="0.7" />
      <circle cx="30" cy="0" r="3" fill="#fadd8c" opacity="0.7" />
    </g>
    
    <!-- Moon phases -->
    <g transform="translate(400, 700)" stroke-width="1.5">
      <circle cx="0" cy="0" r="20" />
      <circle cx="60" cy="0" r="20" fill="#0a0f29" fill-opacity="0.3" />
      <circle cx="120" cy="0" r="20" />
      <path d="M120,0 A20,20 0 0,1 120,0" fill="#0a0f29" fill-opacity="0.3" />
    </g>
    
    <!-- Astronaut helmet -->
    <g transform="translate(1000, 700)">
      <circle cx="0" cy="0" r="35" />
      <!-- Visor reflection -->
      <path d="M-20,-15 Q0,-25 20,-15 Q15,0 0,5 Q-15,0 -20,-15" fill="#fadd8c" fill-opacity="0.2" />
      <!-- Helmet details -->
      <circle cx="0" cy="25" r="8" />
    </g>
    
    <!-- Simple stars scattered -->
    <g stroke-width="1" opacity="0.4">
      <path d="M150,100 L155,110 L165,110 L157,118 L160,128 L150,122 L140,128 L143,118 L135,110 L145,110 Z" />
      <path d="M1800,150 L1805,160 L1815,160 L1807,168 L1810,178 L1800,172 L1790,178 L1793,168 L1785,160 L1795,160 Z" />
      <path d="M200,900 L205,910 L215,910 L207,918 L210,928 L200,922 L190,928 L193,918 L185,910 L195,910 Z" />
      <path d="M1700,800 L1705,810 L1715,810 L1707,818 L1710,828 L1700,822 L1690,828 L1693,818 L1685,810 L1695,810 Z" />
    </g>
    
    <!-- Solar system sketch -->
    <g transform="translate(500, 500)" stroke-width="1" opacity="0.5">
      <!-- Sun -->
      <circle cx="0" cy="0" r="15" fill="#fadd8c" fill-opacity="0.3" />
      <!-- Orbits -->
      <circle cx="0" cy="0" r="30" stroke-dasharray="5,5" />
      <circle cx="0" cy="0" r="50" stroke-dasharray="5,5" />
      <circle cx="0" cy="0" r="70" stroke-dasharray="5,5" />
      <!-- Planets -->
      <circle cx="30" cy="0" r="3" fill="#f04438" fill-opacity="0.5" />
      <circle cx="0" cy="50" r="4" fill="#0a0f29" fill-opacity="0.5" />
      <circle cx="-70" cy="0" r="5" fill="#fadd8c" fill-opacity="0.3" />
    </g>
    
    <!-- Telescope -->
    <g transform="translate(1400, 800)">
      <!-- Base -->
      <path d="M-20,40 L20,40 L15,50 L-15,50 Z" />
      <!-- Legs -->
      <path d="M-10,50 L-15,70" />
      <path d="M10,50 L15,70" />
      <path d="M0,50 L0,65" />
      <!-- Telescope body -->
      <rect x="-5" y="0" width="10" height="40" />
      <circle cx="0" cy="0" r="8" />
      <!-- Eyepiece -->
      <rect x="-3" y="-10" width="6" height="10" />
    </g>
    
    <!-- Space station -->
    <g transform="translate(200, 500)">
      <!-- Main module -->
      <rect x="-30" y="-10" width="60" height="20" />
      <!-- Solar panels -->
      <rect x="-50" y="-15" width="15" height="30" stroke-width="1" />
      <rect x="35" y="-15" width="15" height="30" stroke-width="1" />
      <!-- Lines for solar panels -->
      <path d="M-47,-10 L-38,-10 M-47,-5 L-38,-5 M-47,0 L-38,0 M-47,5 L-38,5 M-47,10 L-38,10" stroke-width="1" />
      <path d="M38,-10 L47,-10 M38,-5 L47,-5 M38,0 L47,0 M38,5 L47,5 M38,10 L47,10" stroke-width="1" />
      <!-- Antenna -->
      <path d="M0,-10 L0,-25" stroke-width="1" />
      <circle cx="0" cy="-25" r="3" />
    </g>
    
    <!-- Comet -->
    <g transform="translate(1100, 150)">
      <!-- Comet head -->
      <circle cx="0" cy="0" r="8" />
      <!-- Tail -->
      <path d="M8,0 Q30,-10 50,-5 Q40,0 30,5 Q20,3 8,0" stroke-dasharray="4,2" />
      <path d="M8,0 Q25,8 45,12 Q35,8 25,4 Q18,2 8,0" stroke-dasharray="3,2" />
    </g>
    
    <!-- Galaxy spiral -->
    <g transform="translate(600, 150)" stroke-width="1">
      <path d="M0,0 Q-10,-10 -20,0 Q-10,20 10,10 Q30,-10 20,-30 Q-20,-40 -40,-20 Q-40,40 20,50 Q80,10 60,-50 Q-10,-80 -70,-40" stroke-dasharray="6,4" />
      <circle cx="0" cy="0" r="3" fill="#fadd8c" fill-opacity="0.4" />
    </g>
    
    <!-- Satellite -->
    <g transform="translate(1700, 300)">
      <!-- Body -->
      <rect x="-15" y="-8" width="30" height="16" />
      <!-- Solar panels -->
      <rect x="-25" y="-12" width="8" height="24" stroke-width="1" />
      <rect x="17" y="-12" width="8" height="24" stroke-width="1" />
      <!-- Dish -->
