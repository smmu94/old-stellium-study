      <circle cx="0" cy="-15" r="2" fill="#0a0f29" fill-opacity="0.3" />
      <!-- Antenna -->
      <path d="M0,-8 L0,-25" stroke-width="1" />
    </g>
    
    <!-- Meteor shower -->
    <g stroke-width="1" stroke-dasharray="2,1">
