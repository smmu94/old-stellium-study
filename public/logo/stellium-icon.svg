<!-- StelliumStudy Icon - Cohete Caricatura -->
<svg width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <!-- Aro azul navy alrededor del cohete -->
  <circle cx="26" cy="26" r="22" fill="none" stroke="#0A0F29" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Cohete estilo caricatura centrado -->
  <g transform="translate(14, 8) rotate(20 12 18)">
    <!-- Cuerpo principal redondeado -->
    <ellipse cx="12" cy="16" rx="5" ry="12" fill="#F04438"/>
    
    <!-- Punta redondeada -->
    <ellipse cx="12" cy="8" rx="4" ry="6" fill="#F04438"/>
    
    <!-- Ventana grande -->
    <circle cx="12" cy="14" r="2.5" fill="#FFFFFF" stroke="#F04438" stroke-width="0.8"/>
    <circle cx="12" cy="14" r="1.5" fill="#0A0F29" opacity="0.3"/>
    
    <!-- Aletas curvas -->
    <ellipse cx="6" cy="24" rx="2.5" ry="4" fill="#F04438"/>
    <ellipse cx="18" cy="24" rx="2.5" ry="4" fill="#F04438"/>
    
    <!-- Llama caricatura -->
    <ellipse cx="10" cy="30" rx="1.5" ry="5" fill="#FF6B35"/>
    <ellipse cx="12" cy="32" rx="1.8" ry="6" fill="#FF4500"/>
    <ellipse cx="14" cy="30" rx="1.5" ry="5" fill="#FF6B35"/>
    
    <!-- Detalles -->
    <circle cx="11" cy="10" r="0.6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="13" cy="9" r="0.4" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>