<!-- Logo StelliumStudy - Versión Blanca Caricatura -->
<svg width="300" height="70" viewBox="0 0 300 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Cohete Estilo Caricatura -->
  <g transform="translate(8, 10) rotate(20 25 25)">
    <!-- Cuerpo principal con forma más redondeada -->
    <ellipse cx="20" cy="22" rx="8" ry="18" fill="#F04438"/>
    
    <!-- Punta del cohete más suave y redondeada -->
    <ellipse cx="20" cy="8" rx="6" ry="8" fill="#F04438"/>
    
    <!-- Ventana grande estilo caricatura -->
    <circle cx="20" cy="18" r="4" fill="#FFFFFF" stroke="#F04438" stroke-width="1"/>
    <circle cx="20" cy="18" r="2.5" fill="#0A0F29" opacity="0.3"/>
    
    <!-- Aletas laterales más curvas -->
    <ellipse cx="10" cy="32" rx="4" ry="6" fill="#F04438"/>
    <ellipse cx="30" cy="32" rx="4" ry="6" fill="#F04438"/>
    
    <!-- Llama estilo caricatura con múltiples formas -->
    <ellipse cx="17" cy="42" rx="2" ry="8" fill="#FF6B35"/>
    <ellipse cx="20" cy="45" rx="2.5" ry="10" fill="#FF4500"/>
    <ellipse cx="23" cy="42" rx="2" ry="8" fill="#FF6B35"/>
    
    <!-- Detalles decorativos -->
    <rect x="17" y="25" width="6" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="18" cy="12" r="1" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="22" cy="10" r="0.8" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- Texto StelliumStudy más grande y unido en blanco -->
  <text x="70" y="48" 
        font-family="Orbitron, monospace" 
        font-size="28" 
        font-weight="800" 
        fill="#FFFFFF"
        letter-spacing="-0.5px">StelliumStudy</text>
</svg>